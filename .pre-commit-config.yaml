repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --check
        language: system
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        pass_filenames: false
      - id: cargo-test
        name: cargo test
        entry: cargo test
        language: system
        pass_filenames: false
      - id: cargo-doc
        name: cargo doc
        entry: cargo doc --no-deps
        language: system
        pass_filenames: false
      - id: dependency-age
        name: dependency age
        entry: cargo quarantine
        language: system
        pass_filenames: false
      - id: cargo-package
        name: cargo package
        entry: cargo package
        language: system
        pass_filenames: false
      - id: zizmor
        name: zizmor (github actions audit)
        entry: zizmor .github/workflows
        language: system
        pass_filenames: false
